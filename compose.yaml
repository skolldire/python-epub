name: bookforge

services:
  bookforge:
    build:
      context: .
      dockerfile: Dockerfile
    image: bookforge:latest
    container_name: bookforge
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - bookforge_data:/data
    env_file:
      - path: .env
        required: false
    deploy:
      resources:
        limits:
          memory: 2g        # OCR + pdfplumber can be RAM-hungry on large PDFs
          cpus: "1.5"
        reservations:
          memory: 256m
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  bookforge_data:
    driver: local
