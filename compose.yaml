name: bookforge

services:
  bookforge:
    build:
      context: .
      dockerfile: Dockerfile
    image: bookforge:latest
    container_name: bookforge
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - bookforge_data:/data
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      DEBUG: "false"
      OCR_LANG: spa+eng
      MAX_UPLOAD_BYTES: "52428800"
      MAX_PAGES: "1000"
      MAX_CONVERSION_SECONDS: "300"
      # REQUIRED in production — set a strong random value:
      #   API_KEY: "$(openssl rand -hex 32)"
      # API_KEY: ""
      #
      # Restrict to your domain instead of wildcard:
      #   CORS_ORIGINS: '["https://yourapp.example.com"]'
      CORS_ORIGINS: '["*"]'
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  bookforge_data:
    driver: local
