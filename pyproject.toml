[project]
name = "pdf-epub"
version = "0.1.0"
description = "PDF to EPUB converter service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "structlog>=24.2,<27.0",
    "python-multipart>=0.0.9,<1.0",
    "jinja2>=3.1,<4.0",
    "aiofiles>=23.0,<25.0",
    "pdfplumber>=0.11,<1.0",
    "pdf2image>=1.17,<2.0",
    "pytesseract>=0.3.10,<1.0",
    "ebooklib>=0.18,<1.0",
    "Pillow>=10.0,<12.0",
    "slowapi>=0.1.9,<1.0",
    "prometheus-fastapi-instrumentator>=7.0,<8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx2>=2.0",
    "mypy>=1.10",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_epub"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["pdf_epub"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "pdf2image.*", "pytesseract.*", "ebooklib.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:slowapi",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    # Require system binaries (Tesseract, Poppler) — not available in CI without them.
    "*/infrastructure/extractors/tesseract_ocr.py",
    "*/infrastructure/renderers/poppler_renderer.py",
    # The full pdfplumber extractor needs real PDFs; covered by integration tests only.
    "*/infrastructure/extractors/pdfplumber_extractor.py",
    # ebooklib builder needs real documents; covered by integration tests only.
    "*/infrastructure/builders/ebooklib_builder.py",
]

[tool.coverage.report]
show_missing = true
# Baseline measured 2026-05-29 with 55 unit + integration tests.
# Omits infrastructure layers that require external binaries / real files.
fail_under = 75
