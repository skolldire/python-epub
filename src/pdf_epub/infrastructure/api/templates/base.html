<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}bookforge{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fdf4ff', 100: '#fae8ff', 200: '#f3d0fe',
              300: '#e9a8fd', 400: '#d946ef', 500: '#a855f7',
              600: '#9333ea', 700: '#7e22ce', 800: '#6b21a8', 900: '#581c87',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { background: #07050f; }

    /* Floating ambient orbs */
    @keyframes orb-float-a {
      0%,100% { transform: translate(0,0) scale(1); }
      33%      { transform: translate(30px,-40px) scale(1.05); }
      66%      { transform: translate(-20px, 20px) scale(0.97); }
    }
    @keyframes orb-float-b {
      0%,100% { transform: translate(0,0) scale(1); }
      40%      { transform: translate(-25px, 35px) scale(1.04); }
      70%      { transform: translate(15px,-20px) scale(0.98); }
    }
    @keyframes orb-float-c {
      0%,100% { transform: translate(0,0) scale(1); }
      50%      { transform: translate(20px, 15px) scale(1.06); }
    }
    .orb { position:fixed; border-radius:50%; filter:blur(90px); pointer-events:none; z-index:0; }
    .orb-a { width:640px; height:640px; background:rgba(139,68,255,0.14);
             top:-160px; left:-120px; animation:orb-float-a 12s ease-in-out infinite; }
    .orb-b { width:520px; height:520px; background:rgba(109,40,217,0.10);
             top:40%; right:-140px;   animation:orb-float-b 16s ease-in-out 2s infinite; }
    .orb-c { width:400px; height:400px; background:rgba(192,38,211,0.09);
             bottom:-80px; left:35%;  animation:orb-float-c 10s ease-in-out 4s infinite; }

    /* Glass surface */
    .glass {
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.07);
    }
    .glass-card {
      background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 100%);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.08);
    }

    /* Progress */
    .progress-bar { transition: width 0.55s cubic-bezier(0.4,0,0.2,1); }
    @keyframes shimmer {
      0%   { background-position:-200% 0 }
      100% { background-position: 200% 0 }
    }
    .shimmer {
      background: linear-gradient(90deg,
        rgba(168,85,247,0.25) 25%,
        rgba(217,70,239,0.55) 50%,
        rgba(168,85,247,0.25) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.8s ease-in-out infinite;
    }

    /* Card entrance */
    @keyframes card-in {
      from { opacity:0; transform:translateY(14px); }
      to   { opacity:1; transform:translateY(0);    }
    }
    .card-in { animation: card-in 0.28s ease both; }

    /* Modal entrance */
    @keyframes modal-in {
      from { opacity:0; transform:scale(0.93) translateY(16px); }
      to   { opacity:1; transform:scale(1)    translateY(0);    }
    }
    .modal-card { animation: modal-in 0.28s cubic-bezier(0.34,1.56,0.64,1) both; }

    /* Input focus glow */
    input:focus {
      outline: none;
      border-color: rgba(168,85,247,0.6) !important;
      box-shadow: 0 0 0 3px rgba(168,85,247,0.12);
    }
  </style>
</head>
<body class="min-h-full text-white relative overflow-x-hidden">

  <!-- Ambient orbs -->
  <div aria-hidden="true">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="orb orb-c"></div>
  </div>

  <!-- Header -->
  <header class="sticky top-0 z-50 border-b border-white/[0.06]"
          style="background:rgba(7,5,15,0.82);backdrop-filter:blur(22px);">
    <div class="max-w-5xl mx-auto px-6 py-3.5 flex items-center justify-between">

      <a href="/" class="flex items-center gap-3 group">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center
                    bg-gradient-to-br from-violet-500 to-purple-700
                    shadow-lg shadow-purple-900/50
                    group-hover:scale-110 group-hover:shadow-purple-500/30
                    transition-all duration-200">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" fill="none"
               viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25
                     A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0
                     016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18
                     a8.966 8.966 0 00-6 2.292m0-14.25v14.25"/>
          </svg>
        </div>
        <div class="leading-tight">
          <p class="text-base font-bold tracking-tight
                    bg-gradient-to-r from-white to-white/60 bg-clip-text text-transparent">
            bookforge
          </p>
          <p class="hidden sm:block text-[10px] text-white/30 font-mono -mt-0.5">PDF → EPUB</p>
        </div>
      </a>

      <div class="flex items-center gap-4">
        <div class="flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <span class="text-xs text-white/55">online</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main content -->
  <main class="relative z-10 max-w-5xl mx-auto px-6 py-12">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="relative z-10 border-t border-white/[0.05] py-8 mt-6">
    <div class="max-w-5xl mx-auto px-6 text-center">
      <p class="text-xs text-white/45">
        bookforge &mdash; MIT License &mdash; PDF to EPUB converter
      </p>
    </div>
  </footer>

</body>
</html>
