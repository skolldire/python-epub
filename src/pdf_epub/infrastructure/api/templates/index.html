{% extends "base.html" %}
{% block title %}bookforge — PDF to EPUB{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">

  <!-- ── Hero ─────────────────────────────────────────────────────────────── -->
  <div class="text-center mb-10">
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full
                bg-violet-500/15 border border-violet-500/30 text-violet-300
                text-xs font-semibold tracking-wider uppercase mb-4">
      <span class="w-1.5 h-1.5 rounded-full bg-violet-400 animate-pulse"></span>
      Free &amp; open source
    </div>
    <h1 class="text-5xl font-black tracking-tight text-white mb-3">
      PDF <span class="bg-gradient-to-r from-violet-400 to-fuchsia-400
                       bg-clip-text text-transparent">→</span> EPUB
    </h1>
    <p class="text-white/65 text-base max-w-sm mx-auto">
      Turn any PDF into a clean, readable ebook in seconds
    </p>
  </div>

  <!-- ── Tab nav ─────────────────────────────────────────────────────────── -->
  <div class="flex gap-1 p-1 bg-white/[0.06] rounded-2xl mb-6 border border-white/[0.12]">
    <button id="tab-btn-single"
            class="tab-btn flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl
                   text-sm font-semibold transition-all duration-200
                   bg-violet-600 text-white shadow-lg shadow-violet-900/40"
            data-tab="single" onclick="switchTab('single')">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0
                 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0
                 01.293.707V19a2 2 0 01-2 2z"/>
      </svg>
      Single file
    </button>
    <button id="tab-btn-multi"
            class="tab-btn flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl
                   text-sm font-semibold transition-all duration-200
                   text-white/65 hover:text-white hover:bg-white/[0.05]"
            data-tab="multi" onclick="switchTab('multi')">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0
                 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5
                 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
      </svg>
      Multiple files
    </button>
  </div>

  <!-- ════════════════════════════════════════════════════════════════════════
       TAB: INDIVIDUAL
  ═══════════════════════════════════════════════════════════════════════════ -->
  <div id="tab-single" class="tab-panel space-y-4">

    <!-- Drop zone -->
    <label id="single-dropzone"
           class="relative flex flex-col items-center justify-center gap-4 w-full rounded-2xl
                  border-2 border-dashed border-white/20 cursor-pointer py-14 px-6
                  hover:border-violet-500/60 hover:bg-violet-500/[0.04]
                  transition-all duration-300 group overflow-hidden">
      <div class="absolute inset-0 bg-gradient-to-b from-violet-600/[0.05] to-transparent
                  opacity-0 group-hover:opacity-100 transition-opacity rounded-2xl pointer-events-none"></div>

      <!-- Empty state -->
      <div id="single-state-empty" class="flex flex-col items-center gap-4 relative z-10">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-violet-600/25 to-fuchsia-600/15
                    border border-violet-500/30 flex items-center justify-center
                    group-hover:scale-110 group-hover:from-violet-600/35
                    transition-all duration-300 shadow-lg shadow-violet-900/30">
          <svg class="w-7 h-7 text-violet-400" fill="none" viewBox="0 0 24 24"
               stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0
                     0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/>
          </svg>
        </div>
        <div class="text-center">
          <p class="text-white/85 font-semibold text-sm">
            Drop your PDF here
            <span class="text-white/50 font-normal">&nbsp;or&nbsp;</span>
            <span class="text-violet-400 font-semibold">click to browse</span>
          </p>
          <p class="text-white/50 text-xs mt-1.5">PDF files only &mdash; max 50 MB</p>
        </div>
      </div>

      <!-- Selected state -->
      <div id="single-state-selected"
           class="hidden flex-col items-center gap-3 w-full px-4 relative z-10">
        <div class="w-12 h-12 rounded-xl bg-violet-600/25 border border-violet-500/40
                    flex items-center justify-center">
          <svg class="w-6 h-6 text-violet-400" fill="none" viewBox="0 0 24 24"
               stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125
                     1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0
                     12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125
                     1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0
                     1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/>
          </svg>
        </div>
        <div class="text-center">
          <p id="single-filename" class="text-white font-bold text-sm truncate max-w-xs"></p>
          <p id="single-fileinfo" class="text-white/60 text-xs mt-0.5"></p>
          <p class="text-violet-400/80 text-xs mt-1">Click to change</p>
        </div>
      </div>

      <input id="single-input" type="file" accept=".pdf" class="hidden"/>
    </label>

    <!-- Metadata (shown after file selected) -->
    <div id="single-meta"
         class="hidden bg-white/[0.05] border border-white/[0.14] rounded-2xl p-5 space-y-4">
      <p class="text-xs font-bold uppercase tracking-widest text-white/55">Book details</p>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-white/70 mb-1.5">
            Title <span class="text-white/40 font-normal">(optional)</span>
          </label>
          <input id="single-title"
                 class="w-full rounded-xl bg-white/[0.06] border border-white/[0.14] px-3 py-2.5
                        text-sm text-white placeholder-white/40
                        focus:border-violet-500/60 focus:ring-2 focus:ring-violet-500/15
                        outline-none transition-all"
                 type="text" maxlength="500" placeholder="Auto-detected"/>
        </div>
        <div>
          <label class="block text-xs font-semibold text-white/70 mb-1.5">
            Author <span class="text-white/40 font-normal">(optional)</span>
          </label>
          <input id="single-author"
                 class="w-full rounded-xl bg-white/[0.06] border border-white/[0.14] px-3 py-2.5
                        text-sm text-white placeholder-white/40
                        focus:border-violet-500/60 focus:ring-2 focus:ring-violet-500/15
                        outline-none transition-all"
                 type="text" maxlength="500" placeholder="Auto-detected"/>
        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-white/70 mb-1.5">
          Cover image <span class="text-white/40 font-normal">(JPEG/PNG — auto-extracted if omitted)</span>
        </label>
        <label class="inline-flex items-center gap-2 cursor-pointer px-3 py-2 rounded-xl
                      bg-white/[0.06] border border-white/[0.14] text-white/65 text-xs
                      hover:bg-white/[0.10] hover:text-white transition-all">
          <svg class="w-3.5 h-3.5 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd"
                  d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0
                     00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z" clip-rule="evenodd"/>
          </svg>
          <span id="single-cover-name">Choose cover image</span>
          <input id="single-cover" type="file"
                 accept=".jpg,.jpeg,.png,image/jpeg,image/png" class="hidden"/>
        </label>
      </div>
    </div>

    <!-- Convert button -->
    <button id="single-btn" disabled
            class="w-full flex items-center justify-center gap-2.5 rounded-2xl py-4
                   bg-gradient-to-r from-violet-600 to-fuchsia-600
                   hover:from-violet-500 hover:to-fuchsia-500
                   text-white font-bold text-sm
                   disabled:opacity-30 disabled:cursor-not-allowed
                   transition-all duration-200 active:scale-[0.99]
                   shadow-lg shadow-violet-900/40 hover:shadow-violet-700/50">
      <svg id="single-btn-icon" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
           stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992
                 m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7
                 M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/>
      </svg>
      <span id="single-btn-label">Convert to EPUB</span>
    </button>
  </div>

  <!-- ════════════════════════════════════════════════════════════════════════
       TAB: MULTIPLE
  ═══════════════════════════════════════════════════════════════════════════ -->
  <div id="tab-multi" class="tab-panel hidden space-y-4">

    <!-- Drop zone (compact) -->
    <label id="multi-dropzone"
           class="relative flex items-center gap-4 w-full rounded-2xl py-6 px-6
                  border-2 border-dashed border-white/20 cursor-pointer
                  hover:border-violet-500/60 hover:bg-violet-500/[0.04]
                  transition-all duration-300 group">
      <div class="w-10 h-10 rounded-xl bg-violet-600/20 border border-violet-500/30
                  flex items-center justify-center flex-shrink-0
                  group-hover:bg-violet-600/30 transition-colors">
        <svg class="w-5 h-5 text-violet-400" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0
                   0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/>
        </svg>
      </div>
      <div>
        <p id="multi-drop-label" class="text-white/85 font-semibold text-sm">
          Drag &amp; drop PDFs here, or click to browse
        </p>
        <p class="text-white/50 text-xs mt-0.5">Multiple files &mdash; max 50 MB each</p>
      </div>
      <input id="multi-input" type="file" accept=".pdf" multiple class="hidden"/>
    </label>

    <!-- File queue list -->
    <div id="multi-list" class="space-y-2 hidden"></div>

    <!-- Convert button -->
    <button id="multi-btn" disabled
            class="w-full flex items-center justify-center gap-2.5 rounded-2xl py-4
                   bg-gradient-to-r from-violet-600 to-fuchsia-600
                   hover:from-violet-500 hover:to-fuchsia-500
                   text-white font-bold text-sm
                   disabled:opacity-30 disabled:cursor-not-allowed
                   transition-all duration-200 active:scale-[0.99]
                   shadow-lg shadow-violet-900/40">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992
                 m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7
                 M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/>
      </svg>
      <span id="multi-btn-label">Convert to EPUB</span>
    </button>
  </div>

  <!-- ════════════════════════════════════════════════════════════════════════
       PROGRESS SECTION
  ═══════════════════════════════════════════════════════════════════════════ -->
  <div id="progress-section" class="hidden mt-6 space-y-3">
    <div class="flex items-center justify-between px-1">
      <p class="text-xs font-bold uppercase tracking-widest text-white/55">
        Conversion queue
      </p>
      <span id="progress-summary" class="text-xs text-white/50"></span>
    </div>
    <div id="progress-list" class="space-y-3"></div>
  </div>

</div>

<!-- ════════════════════════════════════════════════════════════════════════
     COMPLETION MODAL
═══════════════════════════════════════════════════════════════════════════ -->
<div id="done-modal" class="fixed inset-0 z-[100] hidden items-center justify-center p-4">
  <!-- Backdrop -->
  <div class="absolute inset-0 bg-black/75 backdrop-blur-md" onclick="closeModal()"></div>
  <!-- Card -->
  <div class="modal-card relative bg-[#0e0b1a] border border-white/[0.15] rounded-2xl p-8
              max-w-md w-full shadow-2xl shadow-black/70 space-y-6">

    <!-- Success icon -->
    <div class="flex justify-center">
      <div class="w-18 h-18 rounded-full bg-emerald-500/15 border-2 border-emerald-500/40
                  flex items-center justify-center p-4">
        <svg class="w-9 h-9 text-emerald-400" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
        </svg>
      </div>
    </div>

    <!-- Title -->
    <div class="text-center">
      <h2 id="modal-title" class="text-2xl font-black text-white"></h2>
      <p id="modal-subtitle" class="text-white/60 text-sm mt-2"></p>
    </div>

    <!-- Download list -->
    <div id="modal-downloads" class="space-y-2 max-h-52 overflow-y-auto pr-1"></div>

    <!-- Close / start over -->
    <button onclick="closeModal()"
            class="w-full flex items-center justify-center gap-2 py-3.5 rounded-xl
                   bg-gradient-to-r from-violet-600 to-fuchsia-600
                   hover:from-violet-500 hover:to-fuchsia-500
                   text-white font-bold text-sm transition-all
                   shadow-lg shadow-violet-900/40 active:scale-[0.99]">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11
                 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
      </svg>
      Start over
    </button>
  </div>
</div>

<!-- ── MULTI FILE ROW TEMPLATE ─────────────────────────────────────────────── -->
<template id="multi-row-tpl">
  <div class="flex items-center gap-3 bg-white/[0.05] border border-white/[0.12]
              rounded-xl px-4 py-3 group" data-idx="">
    <div class="w-8 h-8 rounded-lg bg-violet-600/15 border border-violet-500/25
                flex items-center justify-center flex-shrink-0">
      <svg class="w-4 h-4 text-violet-400" fill="none" viewBox="0 0 24 24"
           stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0
                 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5
                 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504
                 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/>
      </svg>
    </div>
    <div class="flex-1 min-w-0">
      <p class="row-name text-sm font-semibold text-white truncate"></p>
      <p class="row-info text-xs text-white/55 mt-0.5"></p>
    </div>
    <button class="row-del w-7 h-7 rounded-lg text-white/40 hover:text-red-400
                   hover:bg-red-500/15 flex items-center justify-center
                   transition-all opacity-0 group-hover:opacity-100 flex-shrink-0"
            type="button">
      <svg class="w-3.5 h-3.5" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd"
              d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0
                 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10
                 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1
                 1 0 010-1.414z" clip-rule="evenodd"/>
      </svg>
    </button>
  </div>
</template>

<!-- ── PROGRESS ROW TEMPLATE ──────────────────────────────────────────────── -->
<template id="progress-row-tpl">
  <div class="progress-row bg-white/[0.05] border border-white/[0.12]
              rounded-2xl p-4 space-y-3" data-job="">

    <!-- File name + status badge -->
    <div class="flex items-start justify-between gap-3">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-8 h-8 rounded-lg bg-violet-600/15 border border-violet-500/25
                    flex items-center justify-center flex-shrink-0">
          <svg class="w-4 h-4 text-violet-400" fill="none" viewBox="0 0 24 24"
               stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0
                     0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5
                     3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504
                     1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/>
          </svg>
        </div>
        <p class="pr-name text-sm font-semibold text-white truncate"></p>
      </div>
      <span class="pr-badge px-2.5 py-1 rounded-full text-[10px] font-bold uppercase
                   tracking-wider bg-white/15 text-white/65 flex-shrink-0"></span>
    </div>

    <!-- Step pipeline -->
    <div class="pr-pipeline flex items-center gap-0"></div>

    <!-- Progress bar -->
    <div class="space-y-1.5">
      <div class="w-full bg-white/[0.08] rounded-full h-1.5 overflow-hidden">
        <div class="pr-bar h-full rounded-full bg-violet-500
                    transition-[width] duration-700 ease-out" style="width:0%"></div>
      </div>
      <div class="flex items-center justify-between gap-2">
        <p class="pr-step-label text-xs text-white/65 flex items-center gap-1.5">
          <span class="pr-step-spinner inline-block w-3 h-3 rounded-full border border-violet-500/50
                       border-t-violet-400 animate-spin hidden"></span>
          <span class="pr-step-text"></span>
        </p>
        <div class="flex items-center gap-3">
          <span class="pr-pct text-xs text-white/50 tabular-nums"></span>
          <a class="pr-dl hidden items-center gap-1.5 px-3 py-1 rounded-lg text-xs font-bold
                    bg-emerald-500/20 border border-emerald-500/35 text-emerald-300
                    hover:bg-emerald-500/30 hover:text-emerald-200 transition-all" href="#">
            <svg class="w-3 h-3" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd"
                    d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0
                       011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414
                       1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z"
                    clip-rule="evenodd"/>
            </svg>
            Download EPUB
          </a>
        </div>
      </div>
    </div>

  </div>
</template>

{% block scripts %}<script src="/static/index.js"></script>{% endblock %}
{% block scripts %}<script src="/static/index.js"></script>{% endblock %}
