{% extends "base.html" %}
{% block title %}bookforge — PDF to EPUB{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">

  <!-- ── Page title ──────────────────────────────────────────────────────── -->
  <div class="text-center mb-8">
    <h1 class="text-4xl font-extrabold tracking-tight text-white mb-2">
      PDF <span class="text-violet-400">→</span> EPUB
    </h1>
    <p class="text-white/40 text-sm">Convert your PDFs into clean, readable ebooks</p>
  </div>

  <!-- ── Tab nav ─────────────────────────────────────────────────────────── -->
  <div class="flex gap-1 p-1 bg-white/[0.05] rounded-xl mb-6 border border-white/[0.07]">
    <button id="tab-btn-single"
            class="tab-btn flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all duration-150
                   bg-violet-600 text-white shadow-sm"
            data-tab="single" onclick="switchTab('single')">
      Individual
    </button>
    <button id="tab-btn-multi"
            class="tab-btn flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all duration-150
                   text-white/40 hover:text-white/70"
            data-tab="multi" onclick="switchTab('multi')">
      Multiple
    </button>
  </div>

  <!-- ════════════════════════════════════════════════════════════════════════
       TAB: INDIVIDUAL
  ═══════════════════════════════════════════════════════════════════════════ -->
  <div id="tab-single" class="tab-panel">
    <div class="bg-white/[0.04] border border-white/[0.08] rounded-2xl p-6 space-y-5">

      <!-- Drop zone -->
      <div>
        <label id="single-dropzone"
               class="flex flex-col items-center justify-center gap-3 w-full rounded-xl
                      border-2 border-dashed border-white/20 cursor-pointer py-10
                      hover:border-violet-400/50 hover:bg-violet-500/[0.03] transition-all group">
          <!-- Default state -->
          <div id="single-state-empty" class="flex flex-col items-center gap-3">
            <div class="w-14 h-14 rounded-2xl bg-violet-600/15 border border-violet-500/20
                        flex items-center justify-center group-hover:bg-violet-600/25 transition-colors">
              <svg class="w-6 h-6 text-violet-400" fill="none" viewBox="0 0 24 24"
                   stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021
                         18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/>
              </svg>
            </div>
            <div class="text-center">
              <p class="text-white/70 font-semibold text-sm">Drop a PDF here, or click to browse</p>
              <p class="text-white/30 text-xs mt-1">Max 50 MB · .pdf only</p>
            </div>
          </div>
          <!-- Selected state -->
          <div id="single-state-selected" class="hidden flex-col items-center gap-2 w-full px-6">
            <svg class="w-10 h-10 text-violet-400" fill="none" viewBox="0 0 24 24"
                 stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0
                       0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5
                       3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504
                       1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/>
            </svg>
            <p id="single-filename" class="text-white font-semibold text-sm text-center truncate max-w-full"></p>
            <p id="single-fileinfo" class="text-white/40 text-xs"></p>
            <p class="text-violet-400/70 text-xs">Click to change file</p>
          </div>
          <input id="single-input" type="file" accept=".pdf" class="hidden"/>
        </label>
      </div>

      <!-- Metadata fields (shown after file selected) -->
      <div id="single-meta" class="hidden space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-white/50 mb-1.5">
              Title <span class="text-white/25 font-normal">(optional)</span>
            </label>
            <input id="single-title"
                   class="w-full rounded-lg bg-white/[0.04] border border-white/[0.08] px-3 py-2.5
                          text-sm text-white placeholder-white/20 outline-none
                          focus:border-violet-400/60 focus:ring-1 focus:ring-violet-400/20
                          transition-all"
                   type="text" maxlength="500" placeholder="Auto-detected from PDF"/>
          </div>
          <div>
            <label class="block text-xs font-medium text-white/50 mb-1.5">
              Author <span class="text-white/25 font-normal">(optional)</span>
            </label>
            <input id="single-author"
                   class="w-full rounded-lg bg-white/[0.04] border border-white/[0.08] px-3 py-2.5
                          text-sm text-white placeholder-white/20 outline-none
                          focus:border-violet-400/60 focus:ring-1 focus:ring-violet-400/20
                          transition-all"
                   type="text" maxlength="500" placeholder="Auto-detected from PDF"/>
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-white/50 mb-1.5">
            Cover image <span class="text-white/25 font-normal">(JPEG / PNG — auto-extracted if omitted)</span>
          </label>
          <label class="inline-flex items-center gap-2 cursor-pointer px-3 py-2 rounded-lg
                        bg-white/[0.04] border border-white/[0.08] text-white/50 text-sm
                        hover:bg-white/[0.08] hover:text-white/80 transition-all">
            <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd"
                    d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0
                       00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z" clip-rule="evenodd"/>
            </svg>
            <span id="single-cover-name">Choose cover image</span>
            <input id="single-cover" type="file"
                   accept=".jpg,.jpeg,.png,image/jpeg,image/png" class="hidden"/>
          </label>
        </div>
      </div>

      <!-- Convert button -->
      <button id="single-btn" disabled
              class="w-full flex items-center justify-center gap-2.5 rounded-xl py-3.5
                     bg-violet-600 hover:bg-violet-500 text-white font-bold text-sm
                     disabled:opacity-30 disabled:cursor-not-allowed
                     transition-colors duration-150 active:scale-[0.99]">
        <svg id="single-btn-icon" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992
                   m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7
                   M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/>
        </svg>
        <span id="single-btn-label">Convert to EPUB</span>
      </button>
    </div>
  </div>

  <!-- ════════════════════════════════════════════════════════════════════════
       TAB: MULTIPLE
  ═══════════════════════════════════════════════════════════════════════════ -->
  <div id="tab-multi" class="tab-panel hidden">
    <div class="bg-white/[0.04] border border-white/[0.08] rounded-2xl p-6 space-y-4">

      <!-- Drop zone (compact) -->
      <label id="multi-dropzone"
             class="flex items-center justify-center gap-3 w-full rounded-xl py-5 px-6
                    border-2 border-dashed border-white/20 cursor-pointer
                    hover:border-violet-400/50 hover:bg-violet-500/[0.03] transition-all">
        <svg class="w-5 h-5 text-violet-400 flex-shrink-0" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5
                   m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/>
        </svg>
        <div>
          <p id="multi-drop-label" class="text-white/70 font-semibold text-sm">
            Drag &amp; drop PDFs here, or click to browse
          </p>
          <p class="text-white/30 text-xs mt-0.5">Multiple files · Max 50 MB each</p>
        </div>
        <input id="multi-input" type="file" accept=".pdf" multiple class="hidden"/>
      </label>

      <!-- File list -->
      <div id="multi-list" class="space-y-2 hidden"></div>

      <!-- Convert button -->
      <button id="multi-btn" disabled
              class="w-full flex items-center justify-center gap-2.5 rounded-xl py-3.5
                     bg-violet-600 hover:bg-violet-500 text-white font-bold text-sm
                     disabled:opacity-30 disabled:cursor-not-allowed
                     transition-colors duration-150 active:scale-[0.99]">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992
                   m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7
                   M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/>
        </svg>
        <span id="multi-btn-label">Convert to EPUB</span>
      </button>
    </div>
  </div>

  <!-- ════════════════════════════════════════════════════════════════════════
       BOTTOM PROGRESS SECTION  (shared, appears during/after conversion)
  ═══════════════════════════════════════════════════════════════════════════ -->
  <div id="progress-section" class="hidden mt-6">
    <div class="bg-white/[0.04] border border-white/[0.08] rounded-2xl p-6">
      <h3 class="text-xs font-bold uppercase tracking-widest text-white/40 mb-4">
        Conversion progress
      </h3>
      <div id="progress-list" class="space-y-4"></div>
    </div>
  </div>

</div>

<!-- ── MULTI FILE ROW TEMPLATE ────────────────────────────────────────────── -->
<template id="multi-row-tpl">
  <div class="flex items-center gap-3 bg-white/[0.03] border border-white/[0.07]
              rounded-xl px-4 py-3" data-idx="">
    <svg class="w-7 h-7 text-violet-400/70 flex-shrink-0" fill="none" viewBox="0 0 24 24"
         stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round"
            d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0
               0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5
               3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504
               1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/>
    </svg>
    <div class="flex-1 min-w-0">
      <p class="row-name text-sm font-semibold text-white truncate"></p>
      <p class="row-info text-xs text-white/35 mt-0.5"></p>
    </div>
    <button class="row-del w-7 h-7 rounded-lg text-white/25 hover:text-red-400
                   hover:bg-red-500/10 flex items-center justify-center transition-all flex-shrink-0"
            type="button">
      <svg class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd"
              d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0
                 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10
                 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1
                 1 0 010-1.414z" clip-rule="evenodd"/>
      </svg>
    </button>
  </div>
</template>

<!-- ── PROGRESS ROW TEMPLATE ────────────────────────────────────────────── -->
<template id="progress-row-tpl">
  <div class="progress-row space-y-1.5" data-job="">
    <div class="flex items-center justify-between gap-2">
      <p class="pr-name text-sm font-medium text-white/80 truncate"></p>
      <div class="flex items-center gap-2 flex-shrink-0">
        <span class="pr-badge px-2 py-0.5 rounded-full text-[11px] font-semibold
                     bg-white/10 text-white/50"></span>
        <span class="pr-pct text-xs text-white/35"></span>
      </div>
    </div>
    <div class="w-full bg-white/[0.06] rounded-full h-2 overflow-hidden">
      <div class="pr-bar h-full rounded-full bg-violet-500
                  transition-[width] duration-700 ease-out" style="width:0%"></div>
    </div>
    <div class="flex items-center justify-between gap-2">
      <p class="pr-step text-xs text-white/40"></p>
      <a class="pr-dl hidden items-center gap-1.5 text-xs font-semibold text-emerald-400
                hover:text-emerald-300 transition-colors" href="#">
        <svg class="w-3.5 h-3.5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd"
                d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0
                   011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414
                   1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z"
                clip-rule="evenodd"/>
        </svg>
        Download EPUB
      </a>
    </div>
  </div>
</template>

<script>
// ── State ─────────────────────────────────────────────────────────────────
let currentTab  = 'single';
let singleFile  = null;    // File object for individual mode
let multiQueue  = [];      // [{ idx, file, jobId, done, timer }]

// ── Tab switching ─────────────────────────────────────────────────────────
function switchTab(name) {
  currentTab = name;
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
  document.getElementById(`tab-${name}`).classList.remove('hidden');
  document.querySelectorAll('.tab-btn').forEach(btn => {
    const active = btn.dataset.tab === name;
    btn.className = `tab-btn flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all duration-150 ${
      active ? 'bg-violet-600 text-white shadow-sm' : 'text-white/40 hover:text-white/70'
    }`;
  });
}

// ── Helpers ───────────────────────────────────────────────────────────────
function fmtBytes(b) {
  return b < 1048576 ? (b/1024).toFixed(1)+' KB' : (b/1048576).toFixed(1)+' MB';
}

const STEPS = {
  uploading:  { label:'Uploading…',         pct:8  },
  analyzing:  { label:'Analyzing PDF…',      pct:20 },
  extracting: { label:'Extracting text…',    pct:55 },
  building:   { label:'Building EPUB…',      pct:85 },
};
function parseStep(step) {
  if (!step) return STEPS.analyzing;
  if (step.startsWith('ocr_')) {
    const [,n,t] = step.split('_');
    return { label:`OCR — page ${n} of ${t}`, pct: Math.round(20 + (parseInt(n)/parseInt(t))*60) };
  }
  return STEPS[step] || { label:'Processing…', pct:35 };
}

// ── Progress section helpers ───────────────────────────────────────────────
function ensureProgressSection() {
  document.getElementById('progress-section').classList.remove('hidden');
}

function addProgressRow(jobId, filename) {
  ensureProgressSection();
  const tpl  = document.getElementById('progress-row-tpl');
  const clone = tpl.content.cloneNode(true);
  const row   = clone.firstElementChild;
  row.dataset.job = jobId;
  row.querySelector('.pr-name').textContent  = filename;
  row.querySelector('.pr-badge').textContent = 'uploading';
  row.querySelector('.pr-step').textContent  = 'Uploading…';
  row.querySelector('.pr-pct').textContent   = '8%';
  row.querySelector('.pr-bar').style.width   = '8%';
  document.getElementById('progress-list').appendChild(row);
  return document.querySelector(`[data-job="${jobId}"]`);
}

function getProgressRow(jobId) {
  return document.querySelector(`[data-job="${jobId}"]`);
}

function updateProgressRow(row, { badge, step, pct, done, dlUrl, filename }) {
  const BADGE = {
    uploading:  'bg-amber-500/20 text-amber-300',
    processing: 'bg-blue-500/20 text-blue-300',
    done:       'bg-emerald-500/20 text-emerald-300',
    failed:     'bg-red-500/20 text-red-300',
  };
  if (badge) {
    const b = row.querySelector('.pr-badge');
    b.textContent = badge;
    b.className = `pr-badge px-2 py-0.5 rounded-full text-[11px] font-semibold ${BADGE[badge]||'bg-white/10 text-white/50'}`;
  }
  if (step !== undefined) row.querySelector('.pr-step').textContent = step;
  if (pct  !== undefined) {
    row.querySelector('.pr-pct').textContent = pct + '%';
    const bar = row.querySelector('.pr-bar');
    bar.style.width = pct + '%';
    bar.className = `pr-bar h-full rounded-full transition-[width] duration-700 ease-out ${
      pct >= 100 ? 'bg-emerald-500' : 'bg-violet-500'
    }`;
  }
  if (done && dlUrl) {
    const dl = row.querySelector('.pr-dl');
    dl.href = dlUrl;
    dl.download = filename || '';
    dl.classList.remove('hidden');
    dl.classList.add('flex');
    dl.textContent = '';
    // rebuild with icon
    dl.innerHTML = `<svg class="w-3.5 h-3.5" viewBox="0 0 20 20" fill="currentColor">
      <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
      Download EPUB`;
  }
}

// ── Job polling ───────────────────────────────────────────────────────────
function startPolling(jobId, filename, onDone) {
  const row = getProgressRow(jobId);
  updateProgressRow(row, { badge:'processing', step:'Analyzing PDF…', pct:20 });

  const timer = setInterval(async () => {
    try {
      const d = await fetch(`/api/v1/jobs/${jobId}`).then(r=>r.json());
      if (d.status === 'completed') {
        clearInterval(timer);
        updateProgressRow(row, {
          badge:'done', step:'✓ Complete', pct:100,
          done:true, dlUrl:d.epub_url, filename
        });
        if (onDone) onDone(true);
      } else if (d.status === 'failed') {
        clearInterval(timer);
        updateProgressRow(row, { badge:'failed', step:'✗ ' + (d.error||'Failed'), pct:100 });
        row.querySelector('.pr-bar').className = 'pr-bar h-full rounded-full bg-red-500';
        if (onDone) onDone(false);
      } else if (d.progress_step) {
        const { label, pct } = parseStep(d.progress_step);
        updateProgressRow(row, { badge:'processing', step:label, pct });
      }
    } catch (_) {}
  }, 1500);
}

// ── Submit a job and start tracking ──────────────────────────────────────
async function submitJob(file, title, author, cover, onDone) {
  const fd = new FormData();
  fd.append('file', file);
  if (title)  fd.append('title',  title);
  if (author) fd.append('author', author);
  if (cover)  fd.append('cover',  cover);

  // Use a placeholder row while uploading (job ID unknown yet)
  const placeholderKey = 'uploading_' + Date.now();
  const row = addProgressRow(placeholderKey, file.name);

  try {
    const res  = await fetch('/api/v1/jobs', { method:'POST', body:fd });
    const json = await res.json();
    if (!res.ok) throw new Error(json?.error?.message || `HTTP ${res.status}`);

    // Update row with real job ID
    row.dataset.job = json.id;
    startPolling(json.id, file.name, onDone);
  } catch (err) {
    updateProgressRow(row, { badge:'failed', step:'✗ ' + err.message, pct:0 });
    if (onDone) onDone(false);
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// INDIVIDUAL MODE
// ═══════════════════════════════════════════════════════════════════════════
const singleDropzone = document.getElementById('single-dropzone');
const singleInput    = document.getElementById('single-input');
const singleMeta     = document.getElementById('single-meta');
const singleBtn      = document.getElementById('single-btn');
const singleBtnLbl   = document.getElementById('single-btn-label');

function selectSingleFile(file) {
  if (!file || !file.name.toLowerCase().endsWith('.pdf')) return;
  singleFile = file;

  document.getElementById('single-state-empty').classList.add('hidden');
  const sel = document.getElementById('single-state-selected');
  sel.classList.remove('hidden');
  sel.classList.add('flex');
  document.getElementById('single-filename').textContent = file.name;
  document.getElementById('single-fileinfo').textContent = fmtBytes(file.size);

  singleMeta.classList.remove('hidden');
  singleBtn.disabled = false;

  // Peek for metadata
  (async () => {
    const fd = new FormData(); fd.append('file', file);
    try {
      const m = await fetch('/api/v1/jobs/peek', {method:'POST',body:fd}).then(r=>r.json());
      if (m.page_count > 0)
        document.getElementById('single-fileinfo').textContent = fmtBytes(file.size) + ` · ${m.page_count} pages`;
      if (m.title)  document.getElementById('single-title').value  = m.title;
      if (m.author) document.getElementById('single-author').value = m.author;
    } catch (_) {}
  })();
}

singleDropzone.addEventListener('dragover', e => {
  e.preventDefault(); singleDropzone.classList.add('border-violet-400/50','bg-violet-500/[0.03]');
});
['dragleave','dragend'].forEach(ev =>
  singleDropzone.addEventListener(ev, () =>
    singleDropzone.classList.remove('border-violet-400/50','bg-violet-500/[0.03]')));
singleDropzone.addEventListener('drop', e => {
  e.preventDefault();
  singleDropzone.classList.remove('border-violet-400/50','bg-violet-500/[0.03]');
  selectSingleFile(e.dataTransfer.files[0]);
});
singleInput.addEventListener('change', () => { selectSingleFile(singleInput.files[0]); singleInput.value=''; });

document.getElementById('single-cover').addEventListener('change', function() {
  document.getElementById('single-cover-name').textContent = this.files[0]?.name || 'Choose cover image';
});

singleBtn.addEventListener('click', async () => {
  if (!singleFile) return;
  singleBtn.disabled = true;
  singleBtnLbl.textContent = 'Converting…';

  await submitJob(
    singleFile,
    document.getElementById('single-title').value.trim(),
    document.getElementById('single-author').value.trim(),
    document.getElementById('single-cover').files[0],
    (ok) => {
      singleBtn.disabled = false;
      singleBtnLbl.textContent = 'Convert to EPUB';
    }
  );
});

// ═══════════════════════════════════════════════════════════════════════════
// MULTIPLE MODE
// ═══════════════════════════════════════════════════════════════════════════
const multiDropzone = document.getElementById('multi-dropzone');
const multiInput    = document.getElementById('multi-input');
const multiList     = document.getElementById('multi-list');
const multiBtn      = document.getElementById('multi-btn');
const multiDropLbl  = document.getElementById('multi-drop-label');
const multiRowTpl   = document.getElementById('multi-row-tpl');

function addMultiFiles(files) {
  for (const f of files) {
    if (!f.name.toLowerCase().endsWith('.pdf')) continue;
    const idx  = Date.now() + Math.random();
    const clone = multiRowTpl.content.cloneNode(true);
    const row   = clone.firstElementChild;
    row.dataset.idx = idx;
    row.querySelector('.row-name').textContent = f.name;
    row.querySelector('.row-info').textContent = fmtBytes(f.size);
    row.querySelector('.row-del').addEventListener('click', () => {
      multiQueue = multiQueue.filter(e => e.idx !== idx);
      row.remove();
      syncMulti();
    });
    multiList.appendChild(clone);
    multiQueue.push({ idx, file:f, done:false });

    // Peek for page count
    (async () => {
      const fd = new FormData(); fd.append('file', f);
      try {
        const m = await fetch('/api/v1/jobs/peek',{method:'POST',body:fd}).then(r=>r.json());
        const r2 = multiList.querySelector(`[data-idx="${idx}"] .row-info`);
        if (r2 && m.page_count > 0) r2.textContent = fmtBytes(f.size) + ` · ${m.page_count} pages`;
      } catch (_) {}
    })();
  }
  syncMulti();
}

function syncMulti() {
  const fresh = multiQueue.filter(e => !e.started);
  multiList.classList.toggle('hidden', multiQueue.length === 0);
  multiDropLbl.textContent = multiQueue.length > 0
    ? `${multiQueue.length} file${multiQueue.length>1?'s':''} queued — drop more to add`
    : 'Drag & drop PDFs here, or click to browse';
  multiBtn.disabled = fresh.length === 0;
  document.getElementById('multi-btn-label').textContent = fresh.length > 0
    ? `Convert ${fresh.length} book${fresh.length>1?'s':''} to EPUB`
    : 'Convert to EPUB';
}

multiDropzone.addEventListener('dragover', e => {
  e.preventDefault(); multiDropzone.classList.add('border-violet-400/50','bg-violet-500/[0.03]');
});
['dragleave','dragend'].forEach(ev =>
  multiDropzone.addEventListener(ev, () =>
    multiDropzone.classList.remove('border-violet-400/50','bg-violet-500/[0.03]')));
multiDropzone.addEventListener('drop', e => {
  e.preventDefault();
  multiDropzone.classList.remove('border-violet-400/50','bg-violet-500/[0.03]');
  addMultiFiles(Array.from(e.dataTransfer.files));
});
multiInput.addEventListener('change', () => { addMultiFiles(Array.from(multiInput.files)); multiInput.value=''; });

multiBtn.addEventListener('click', () => {
  const fresh = multiQueue.filter(e => !e.started);
  if (!fresh.length) return;
  let remaining = fresh.length;
  fresh.forEach(entry => {
    entry.started = true;
    submitJob(entry.file, '', '', null, (ok) => {
      entry.done = true;
      remaining--;
      if (remaining === 0) syncMulti();
    });
  });
  syncMulti();
});
</script>
{% endblock %}
