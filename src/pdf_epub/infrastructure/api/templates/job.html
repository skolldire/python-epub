{% extends "base.html" %}
{% block title %}Job {{ job_id[:8] }} — bookforge{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">

  <!-- Heading -->
  <div class="text-center mb-8">
    <h1 class="text-2xl font-black tracking-tight
               bg-gradient-to-r from-white to-white/50 bg-clip-text text-transparent">
      Conversion Job
    </h1>
    <p class="mt-1.5 text-[11px] font-mono text-white/20 tracking-widest select-all">
      {{ job_id }}
    </p>
  </div>

  <!-- Card -->
  <div class="bg-white/[0.03] border border-white/[0.08] rounded-2xl p-6 space-y-6">

    <!-- File + status -->
    <div class="flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-10 h-10 rounded-xl bg-violet-600/10 border border-violet-500/20
                    flex items-center justify-center flex-shrink-0">
          <svg class="w-5 h-5 text-violet-400/70" fill="none" viewBox="0 0 24 24"
               stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0
                     0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5
                     3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504
                     1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/>
          </svg>
        </div>
        <p id="filename" class="text-sm font-semibold text-white/70 truncate"></p>
      </div>
      <span id="status-badge"
            class="px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider
                   bg-white/10 text-white/40 flex-shrink-0">
      </span>
    </div>

    <!-- Step pipeline -->
    <div id="pipeline" class="flex items-center gap-0"></div>

    <!-- Progress bar -->
    <div id="progress-wrap" class="space-y-1.5">
      <div class="w-full bg-white/[0.05] rounded-full h-2 overflow-hidden">
        <div id="progress-bar"
             class="h-full rounded-full bg-violet-500 transition-[width] duration-700 ease-out shimmer"
             style="width:10%"></div>
      </div>
      <div class="flex items-center justify-between">
        <p id="step-label" class="text-xs text-white/40 flex items-center gap-1.5">
          <span id="step-spinner"
                class="inline-block w-3 h-3 rounded-full border border-violet-500/40
                       border-t-violet-400 animate-spin"></span>
          <span id="step-text">Starting…</span>
        </p>
        <span id="step-pct" class="text-xs text-white/25 tabular-nums"></span>
      </div>
    </div>

    <!-- Download button -->
    <a id="download-btn" href="#"
       class="hidden items-center justify-center gap-2.5 w-full px-6 py-3.5 rounded-xl
              font-bold text-sm text-white
              bg-gradient-to-r from-emerald-500 to-teal-500
              hover:from-emerald-400 hover:to-teal-400
              shadow-lg shadow-emerald-900/30
              transition-all active:scale-[0.98]">
      <svg class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd"
              d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0
                 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414
                 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z"
              clip-rule="evenodd"/>
      </svg>
      Download EPUB
    </a>

    <!-- Error box -->
    <div id="error-box"
         class="hidden items-center gap-2.5 px-4 py-3
                bg-red-500/[0.07] border border-red-500/20 rounded-xl
                text-sm text-red-300">
      <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd"
              d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0
                 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
              clip-rule="evenodd"/>
      </svg>
      <span id="error-text"></span>
    </div>

    <!-- Back link -->
    <div class="pt-2 border-t border-white/[0.06] text-center">
      <a href="/"
         class="inline-flex items-center gap-1.5 text-sm font-medium
                text-violet-400 hover:text-violet-300 transition-colors">
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
        Convert another PDF
      </a>
    </div>
  </div>
</div>

<script>
const JOB_ID  = {{ job_id | tojson }};
const POLL_MS = 2000;

// ── Pipeline ───────────────────────────────────────────────────────────────
const PIPELINE_STEPS = [
  { id: 'upload',  icon: '↑', label: 'Upload'  },
  { id: 'analyze', icon: '⚡', label: 'Analyze' },
  { id: 'extract', icon: '✦', label: 'Extract' },
  { id: 'build',   icon: '◈', label: 'Build'   },
  { id: 'done',    icon: '✓', label: 'Done'    },
];

function buildPipeline(container) {
  container.innerHTML = '';
  PIPELINE_STEPS.forEach((s, i) => {
    const node = document.createElement('div');
    node.dataset.step = s.id;
    node.className = 'pipeline-node flex flex-col items-center gap-1 flex-1';
    node.innerHTML = `
      <div class="step-dot w-9 h-9 rounded-full border-2 border-white/10 bg-white/[0.03]
                  flex items-center justify-center text-sm text-white/20
                  transition-all duration-400">${s.icon}</div>
      <span class="step-lbl text-[10px] text-white/20 font-medium transition-colors duration-400">
        ${s.label}
      </span>`;
    container.appendChild(node);
    if (i < PIPELINE_STEPS.length - 1) {
      const line = document.createElement('div');
      line.dataset.lineAfter = s.id;
      line.className = 'pipeline-line flex-1 h-px bg-white/[0.08] mt-4.5 mx-1 transition-all duration-400';
      container.appendChild(line);
    }
  });
}

function setPipelineStep(stepId, failed = false) {
  const container = document.getElementById('pipeline');
  const order = ['upload', 'analyze', 'extract', 'build', 'done'];
  const idx   = order.indexOf(stepId);

  PIPELINE_STEPS.forEach((s, i) => {
    const node   = container.querySelector(`[data-step="${s.id}"]`);
    if (!node) return;
    const dot    = node.querySelector('.step-dot');
    const lbl    = node.querySelector('.step-lbl');
    const lineEl = container.querySelector(`[data-line-after="${s.id}"]`);
    const done   = i < idx;
    const active = i === idx;

    if (failed && active) {
      dot.className = 'step-dot w-9 h-9 rounded-full border-2 border-red-500/60 bg-red-500/10 flex items-center justify-center text-sm text-red-400 transition-all duration-400';
      lbl.className = 'step-lbl text-[10px] text-red-400 font-semibold transition-colors duration-400';
    } else if (done) {
      dot.className = 'step-dot w-9 h-9 rounded-full border-2 border-violet-500/50 bg-violet-500/15 flex items-center justify-center text-sm text-violet-400 transition-all duration-400';
      lbl.className = 'step-lbl text-[10px] text-violet-400/70 font-medium transition-colors duration-400';
      if (lineEl) lineEl.className = 'pipeline-line flex-1 h-px bg-violet-500/30 mt-4.5 mx-1 transition-all duration-400';
    } else if (active) {
      dot.className = 'step-dot w-9 h-9 rounded-full border-2 border-violet-400 bg-violet-500/20 flex items-center justify-center text-sm text-violet-300 shadow-lg shadow-violet-500/30 scale-110 transition-all duration-400';
      lbl.className = 'step-lbl text-[10px] text-violet-300 font-bold transition-colors duration-400';
    } else {
      dot.className = 'step-dot w-9 h-9 rounded-full border-2 border-white/10 bg-white/[0.03] flex items-center justify-center text-sm text-white/20 transition-all duration-400';
      lbl.className = 'step-lbl text-[10px] text-white/20 font-medium transition-colors duration-400';
    }
  });
}

// ── DOM refs ───────────────────────────────────────────────────────────────
const badge       = document.getElementById('status-badge');
const filenameEl  = document.getElementById('filename');
const progressWrap= document.getElementById('progress-wrap');
const progressBar = document.getElementById('progress-bar');
const stepText    = document.getElementById('step-text');
const stepPct     = document.getElementById('step-pct');
const stepSpinner = document.getElementById('step-spinner');
const downloadBtn = document.getElementById('download-btn');
const errorBox    = document.getElementById('error-box');
const errorText   = document.getElementById('error-text');

const BADGE_STYLES = {
  pending:    'bg-amber-500/15 text-amber-300',
  processing: 'bg-blue-500/15 text-blue-300',
  completed:  'bg-emerald-500/15 text-emerald-300',
  failed:     'bg-red-500/15 text-red-300',
};

function progressStepToState(step) {
  if (!step) return { pipelineStep: 'analyze', label: 'Analyzing PDF…', pct: 20 };
  if (step === 'uploading')  return { pipelineStep: 'upload',  label: 'Uploading file…',  pct: 8  };
  if (step === 'analyzing')  return { pipelineStep: 'analyze', label: 'Analyzing PDF…',   pct: 22 };
  if (step === 'extracting') return { pipelineStep: 'extract', label: 'Extracting text…', pct: 55 };
  if (step === 'building')   return { pipelineStep: 'build',   label: 'Building EPUB…',   pct: 85 };
  if (step.startsWith('ocr_')) {
    const [, n, t] = step.split('_');
    const ratio = parseInt(n) / Math.max(1, parseInt(t));
    return { pipelineStep: 'extract', label: `OCR — page ${n} of ${t}`, pct: Math.round(22 + ratio * 58) };
  }
  return { pipelineStep: 'analyze', label: 'Processing…', pct: 35 };
}

let ticks = 0, pollTimer = null;

function render(job) {
  badge.textContent = job.status;
  badge.className   = `px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider flex-shrink-0 ${BADGE_STYLES[job.status] || 'bg-white/10 text-white/40'}`;
  filenameEl.textContent = job.original_filename || '';

  const active = job.status === 'pending' || job.status === 'processing';

  if (active) {
    ticks++;
    const state = progressStepToState(job.progress_step);
    const pct   = job.progress_step
      ? state.pct
      : Math.min(88, 10 + ticks * 5);

    setPipelineStep(state.pipelineStep);
    progressBar.style.width  = pct + '%';
    stepPct.textContent      = pct + '%';
    stepText.textContent     = state.label;
    stepSpinner.classList.remove('hidden');
  }

  if (job.status === 'completed' && job.epub_url) {
    setPipelineStep('done');
    progressBar.style.width = '100%';
    progressBar.className   = 'h-full rounded-full bg-emerald-500 transition-[width] duration-700 ease-out';
    stepText.textContent    = 'Conversion complete!';
    stepSpinner.classList.add('hidden');
    stepPct.textContent     = '100%';

    setTimeout(() => progressWrap.classList.add('hidden'), 1200);

    downloadBtn.href = job.epub_url;
    downloadBtn.classList.remove('hidden');
    downloadBtn.classList.add('flex');
  }

  if (job.status === 'failed') {
    setPipelineStep('build', true);
    progressBar.style.width  = '100%';
    progressBar.className    = 'h-full rounded-full bg-red-500 transition-[width] duration-700 ease-out';
    stepSpinner.classList.add('hidden');
    stepText.textContent     = 'Conversion failed';
    stepPct.textContent      = '';

    errorText.textContent = job.error || 'Conversion failed. Please try again.';
    errorBox.classList.remove('hidden');
    errorBox.classList.add('flex');
  }

  if (job.status === 'completed' || job.status === 'failed') {
    clearInterval(pollTimer);
  }
}

async function poll() {
  try {
    const r = await fetch(`/api/v1/jobs/${JOB_ID}`);
    if (r.ok) render(await r.json());
  } catch (_) {}
}

buildPipeline(document.getElementById('pipeline'));
setPipelineStep('upload');
poll();
pollTimer = setInterval(poll, POLL_MS);
</script>
{% endblock %}
